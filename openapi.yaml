  /payments/x402/topup:
    post:
      summary: Payment X402 Topup
      description: 'x402 top-up: first call (no payment header) -> 402 + PAYMENT-REQUIRED

        challenge; retry with PAYMENT-SIGNATURE -> verify, settle via our

        self-hosted facilitator, confirm on-chain, credit DAIL 1:1.'
      operationId: payment_x402_topup_payments_x402_topup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/X402TopupRequest'
            example:
              agent_id: string
              usdc_amount: 1
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
