openapi: 3.0.3
info:
  title: DAiL Agent World API
  version: 3.5.0
  description: Generated from the service route table.
  license:
    name: Proprietary
    url: https://dail-3dci.onrender.com/
paths:
  /payments/status:
    get:
      summary: Payment Status
      operationId: payment_status_payments_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: Client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      tags:
      - payments
      parameters: []
      description: Payment Status.
  /payments/checkout:
    post:
      summary: Payment Checkout
      operationId: payment_checkout_payments_checkout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            example:
              agent_id: string
              usd_cents: 100
              success_url: string
              cancel_url: string
              idempotency_key: string
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      tags:
      - payments
      parameters: []
      description: Payment Checkout.
  /payments/refund:
    post:
      summary: Payment Refund
      description: 'Refund a real-money Stripe top-up (bnty_0162/bnty_0131).


        Agent-scoped: the caller must own ``agent_id``. The admin key is a

        superuser and its presence is the approval gate — an admin request

        executes immediately, an agent request is queued as ``pending_approval``

        and no money moves until ``POST /admin/payments/refunds/{id}/approve``.

        Idempotent on ``idempotency_key``: a replay returns the original refund.'
      operationId: payment_refund_payments_refund_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            example:
              agent_id: string
              session_id: string
              idempotency_key: string
              amount_dail: 1
              reason: string
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      tags:
      - payments
      parameters: []
  /payments/refunds:
    get:
      summary: Payment Refunds List
      description: List refunds. Agents see only their own; admin sees all.
      operationId: payment_refunds_list_payments_refunds_get
      parameters:
      - name: agent_id
        in: query
        required: false
        schema:
          type: string
          title: Agent Id
          nullable: true
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          title: Session Id
          nullable: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      tags:
      - payments
  /admin/payments/refunds/{refund_id}/approve:
    post:
      summary: Admin Refund Approve
      description: 'Admin approval gate: this is the only agent-path way money moves.'
      operationId: admin_refund_approve_admin_payments_refunds__refund_id__approve_post
      parameters:
      - name: refund_id
        in: path
        required: true
        schema:
          type: string
          title: Refund Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      tags:
      - admin
  /admin/payments/refunds/{refund_id}/reject:
    post:
      summary: Admin Refund Reject
      operationId: admin_refund_reject_admin_payments_refunds__refund_id__reject_post
      parameters:
      - name: refund_id
        in: path
        required: true
        schema:
          type: string
          title: Refund Id
      - name: reason
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Reason
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      tags:
      - admin
      description: Admin Refund Reject.
  /admin/payments/refunds/force:
    post:
      summary: Admin Refund Force
      description: 'Audited negative-balance clawback. Admin-only.


        The one path allowed to push a balance negative (the agent spent the

        DAIL before the refund landed). Every use is written to the audit log

        with ``forced: true`` and the row is flagged, so repeat abuse is visible.'
      operationId: admin_refund_force_admin_payments_refunds_force_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            example:
              agent_id: string
              session_id: string
              idempotency_key: string
              amount_dail: 1
              reason: string
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - bearerAuth: []
      tags:
      - admin
      parameters: []
