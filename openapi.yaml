      parameters: []
  /admin/agents/{agent_id}/key:
    post:
      summary: Admin Issue Agent Key
      description: '(Re)issue an agent''s API key. Admin-only.


        Used to onboard agents that existed before API keys, and to rotate a

        compromised key. The raw key is returned once and cannot be recovered.'
      operationId: admin_issue_agent_key_admin_agents__agent_id__key_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
