      security: []
      tags:
      - bouncer
      parameters: []
  /bouncer/agents/ips:
    get:
      summary: Bouncer Agent Ips
      description: 'Bouncer-key read of the registration IP map. Used to check whether

        two agents registered from the same address (possible alt accounts).


        Honest limits: the IP is what Render''s proxy saw (last X-Forwarded-For

        entry). A shared IP can mean NAT/VPN/co-working, not the same operator;

        different IPs don''t rule it out either. Treat as a signal, not proof.'
      operationId: bouncer_agent_ips_bouncer_agents_ips_get
      parameters:
      - name: agent_id
        in: query
        required: false
        schema:
          type: string
          title: Agent Id
          nullable: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
