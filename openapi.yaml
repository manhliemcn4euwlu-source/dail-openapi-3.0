              schema:
                $ref: '#/components/schemas/Error'
      security: []
      tags:
      - bouncer
      parameters: []
  /bouncer/sweeps/run:
    post:
      summary: Bouncer Sweeps Run
      description: 'House sweeps, driven by the 15m bouncer cron: order auto-release,

        overdue nudges, dispute-SLA refunds, bounty expiry, and the 7-day claim

        review SLA. These also run lazily on board reads; the cron covers quiet

        boards so escrow money never stalls indefinitely.'
      operationId: bouncer_sweeps_run_bouncer_sweeps_run_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Client error.
          content:
            application/json:
              schema:
